<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>アイカツアンコール カード管理</title>
<style>
:root{
  --bg:#fff8fc; --panel:#fff; --text:#3b3440; --muted:#887e8d;
  --line:#eadfe8; --accent:#d65b9d; --accent2:#8d73d6; --shadow:0 8px 28px rgba(91,57,91,.10);
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#fff7fb,#f8f5ff 55%,#fff);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{padding:22px 18px 14px;position:sticky;top:0;background:rgba(255,248,252,.94);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}
.wrap{max-width:1100px;margin:auto;padding:16px}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-bottom:12px}
input,select,button{font:inherit}
input[type=search],input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.stats{font-size:12px;color:var(--muted);margin:8px 2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.thumb{aspect-ratio:0.72;background:#f4edf4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.noimg{font-size:12px;color:var(--muted);padding:12px;text-align:center}
.info{padding:10px}.name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.badge{font-size:10px;padding:3px 6px;border-radius:99px;background:#f7edf5}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
dialog{border:0;border-radius:20px;padding:0;width:min(620px,calc(100% - 24px));box-shadow:0 20px 70px rgba(45,30,50,.25)}
dialog::backdrop{background:rgba(40,25,40,.35)}
.modal{padding:20px}.modal h2{margin:0 0 14px;font-size:19px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:11px;color:var(--muted);display:block;margin:0 0 5px}
.preview{height:180px;border-radius:14px;background:#f4edf4;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.preview img{height:100%;max-width:100%;object-fit:contain}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.drop{border:2px dashed #ddcddd;border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}
@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.filters{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アイカツアンコール">
</head>
<body>
<header>
  <div class="wrap" style="padding:0 16px">
    <h1>🌸 アイカツアンコール カード管理</h1>
    <div class="sub">カードを写真・ファイルから登録して、弾数／プロモ／タイプ／ブランド／レア度で整理</div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="カード名・番号・ブランドなどを検索…">
    <button id="addBtn">＋ カード登録</button>
    <button id="exportBtn" class="secondary">バックアップ</button>
  </div>

  <div class="filters">
    <select id="setFilter"><option value="">弾数：すべて</option></select>
    <select id="promoFilter"><option value="">プロモ：すべて</option><option>通常</option><option>プロモ</option></select>
    <select id="typeFilter"><option value="">タイプ：すべて</option></select>
    <select id="brandFilter"><option value="">ブランド：すべて</option></select>
    <select id="rarityFilter"><option value="">レア度：すべて</option></select>
  </div>

  <div class="stats" id="stats"></div>
  <section id="grid" class="grid"></section>
</main>

<dialog id="dlg">
<div class="modal">
  <h2 id="modalTitle">カードを登録</h2>
  <div class="drop" id="drop">写真・画像ファイルをここにドロップ、または下のボタンから選択</div>
  <input id="file" type="file" accept="image/*,.json,.csv" multiple style="display:none">
  <div class="preview" id="preview"><span class="noimg">カード画像なし</span></div>
  <div class="form">
    <div class="full"><label>カード名</label><input id="name" type="text" placeholder="例：○○コーデ"></div>
    <div><label>カード番号</label><input id="number" type="text" placeholder="例：1-001"></div>
    <div><label>弾数</label><input id="set" type="text" placeholder="例：第1弾"></div>
    <div><label>プロモ</label><select id="promo"><option>通常</option><option>プロモ</option></select></div>
    <div><label>タイプ</label><input id="type" type="text" placeholder="例：キュート"></div>
    <div><label>ブランド</label><input id="brand" type="text" placeholder="例：スターアニス"></div>
    <div><label>レア度</label><input id="rarity" type="text" placeholder="例：N / R / SR / PR"></div>
  </div>
  <div class="actions">
    <button class="secondary" id="cancel">キャンセル</button>
    <button id="save">保存</button>
  </div>
</div>
</dialog>

<script>
const DB='aikatsuEncoreCards_v1';
let cards=[], editingId=null, pendingImage=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});
  r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
 });
}
async function load(){
 const db=await openDB(); const tx=db.transaction('cards','readonly'); const st=tx.objectStore('cards');
 return new Promise(res=>{const out=[]; st.openCursor().onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else{cards=out;render()}}});
}
async function put(card){
 const db=await openDB(); db.transaction('cards','readwrite').objectStore('cards').put(card);
}
async function del(id){
 const db=await openDB(); db.transaction('cards','readwrite').objectStore('cards').delete(id); cards=cards.filter(c=>c.id!==id); render();
}
function values(key){return [...new Set(cards.map(c=>c[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'))}
function fillFilters(){
 const defs=[['set','setFilter','弾数：すべて'],['type','typeFilter','タイプ：すべて'],['brand','brandFilter','ブランド：すべて'],['rarity','rarityFilter','レア度：すべて']];
 defs.forEach(([k,id,label])=>{$(id).innerHTML='<option value="">'+label+'</option>'+values(k).map(v=>`<option>${esc(v)}</option>`).join('')});
}
function render(){
 fillFilters();
 const q=$('search').value.trim().toLowerCase();
 const fs={set:$('setFilter').value,type:$('typeFilter').value,brand:$('brandFilter').value,rarity:$('rarityFilter').value,promo:$('promoFilter').value};
 const list=cards.filter(c=>
  (!q||Object.values(c).some(v=>typeof v==='string'&&v.toLowerCase().includes(q))) &&
  (!fs.set||c.set===fs.set)&&(!fs.type||c.type===fs.type)&&(!fs.brand||c.brand===fs.brand)&&
  (!fs.rarity||c.rarity===fs.rarity)&&(!fs.promo||c.promo===fs.promo)
 ).sort((a,b)=>(a.set||'').localeCompare(b.set||'','ja')||(a.number||'').localeCompare(b.number||'','ja'));
 $('stats').textContent=`${list.length}枚表示 ／ 登録 ${cards.length}枚`;
 $('grid').innerHTML=list.length?list.map(c=>`
  <article class="card" data-id="${c.id}">
   <div class="thumb">${c.image?`<img src="${c.image}" alt="">`:'<div class="noimg">画像なし</div>'}</div>
   <div class="info">
    <div class="name">${esc(c.name||'名称未設定')}</div>
    <div class="meta">${esc(c.number||'番号なし')} · ${esc(c.set||'弾数未設定')}</div>
    <div class="badges">${[c.promo,c.type,c.brand,c.rarity].filter(Boolean).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>
   </div>
  </article>`).join(''):`<div class="empty">まだカードがありません。<br>「＋ カード登録」から写真と情報を追加できます。</div>`;
 document.querySelectorAll('.card').forEach(el=>el.onclick=()=>edit(el.dataset.id));
}
function resetForm(){
 editingId=null; pendingImage=null;
 $('modalTitle').textContent='カードを登録'; $('preview').innerHTML='<span class="noimg">カード画像なし</span>';
 ['name','number','set','type','brand','rarity'].forEach(x=>$(x).value=''); $('promo').value='通常';
}
function edit(id){
 const c=cards.find(x=>x.id===id); if(!c)return;
 editingId=id; pendingImage=c.image||null; $('modalTitle').textContent='カードを編集';
 ['name','number','set','type','brand','rarity'].forEach(x=>$(x).value=c[x]||''); $('promo').value=c.promo||'通常';
 $('preview').innerHTML=c.image?`<img src="${c.image}" alt="">`:'<span class="noimg">画像なし</span>'; $('dlg').showModal();
}
async function imageData(file){
 return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
}
async function importFiles(files){
 for(const f of files){
  if(f.type.startsWith('image/')){
   const img=await imageData(f);
   const c={id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),number:'',set:'',promo:'通常',type:'',brand:'',rarity:'',image:img};
   await put(c); cards.push(c);
  } else if(f.name.endsWith('.json')){
   try{
    const arr=JSON.parse(await f.text()); for(const raw of (Array.isArray(arr)?arr:[arr])){
     const c={id:crypto.randomUUID(),...raw}; delete c.id; c.id=crypto.randomUUID(); await put(c); cards.push(c);
    }
   }catch(e){alert('JSONを読み込めませんでした。')}
  } else if(f.name.endsWith('.csv')) alert('CSVは文字コードや項目名の違いを避けるため、現在はJSONバックアップを推奨しています。');
 }
 render();
}
$('addBtn').onclick=()=>{resetForm();$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('drop').onclick=()=>$('file').click();
$('drop').ondragover=e=>{e.preventDefault();$('drop').style.background='#fff0f8'};
$('drop').ondragleave=()=>$('drop').style.background='';
$('drop').ondrop=async e=>{e.preventDefault();$('drop').style.background='';await handleFiles(e.dataTransfer.files)};
$('file').onchange=async e=>{await handleFiles(e.target.files);e.target.value=''};
async function handleFiles(fs){
 const files=[...fs];
 if(files.length===1 && files[0].type.startsWith('image/')){
  pendingImage=await imageData(files[0]); $('preview').innerHTML=`<img src="${pendingImage}" alt="">`;
 } else await importFiles(files);
}
$('save').onclick=async()=>{
 const c={id:editingId||crypto.randomUUID(),name:$('name').value.trim(),number:$('number').value.trim(),set:$('set').value.trim(),
 promo:$('promo').value,type:$('type').value.trim(),brand:$('brand').value.trim(),rarity:$('rarity').value.trim(),image:pendingImage||''};
 await put(c); const i=cards.findIndex(x=>x.id===c.id); if(i<0)cards.push(c);else cards[i]=c; $('dlg').close();render();
};
['search','setFilter','promoFilter','typeFilter','brandFilter','rarityFilter'].forEach(id=>$(id).oninput=render);
$('exportBtn').onclick=()=>{
 const blob=new Blob([JSON.stringify(cards)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aikatsu-encore-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
